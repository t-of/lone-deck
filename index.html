<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151c36">
  <meta name="description" content="昔からあるひとりトランプ「ソリティア（クロンダイク）」。配られる札は必ず解ける並びだけで、何手でも戻せる。毎日 1 つの「今日の配り」は誰でも同じ札なので、手数と時間を比べられる。">
  <title>LONE DECK — ソリティア：クロンダイクで必ず解ける</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LONE DECK">
  <meta property="og:title" content="LONE DECK — ソリティア：クロンダイクで必ず解ける">
  <meta property="og:description" content="昔からあるひとりトランプ「ソリティア（クロンダイク）」。配られる札は必ず解ける並びだけで、何手でも戻せる。毎日 1 つの「今日の配り」は誰でも同じ札なので、手数と時間を比べられる。">
  <meta property="og:url" content="https://lone-deck.t-of.workers.dev/">
  <meta property="og:image" content="https://lone-deck.t-of.workers.dev/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LONE DECK">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- マークの形（札の絵はすべて自前）。s0 ♠ s1 ♥ s2 ♣ s3 ♦ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="s0" viewBox="-70 -72 140 192"><path d="M0,-70 C 42,-24 66,7 66,36 C 66,62 46,80 21,80 C 9,80 0,72 0,60 C 0,72 -9,80 -21,80 C -46,80 -66,62 -66,36 C -66,7 -42,-24 0,-70 Z M -11,80 L 11,80 L 20,106 C 20,114 11,118 0,118 C -11,118 -20,114 -20,106 Z"/></symbol>
    <symbol id="s1" viewBox="0 0 100 100"><path d="M50 92 C 22 68 4 50 4 30 C 4 15 16 5 29 5 C 39 5 46 11 50 20 C 54 11 61 5 71 5 C 84 5 96 15 96 30 C 96 50 78 68 50 92 Z"/></symbol>
    <symbol id="s2" viewBox="0 0 100 100"><circle cx="50" cy="27" r="21"/><circle cx="27" cy="59" r="21"/><circle cx="73" cy="59" r="21"/><path d="M40 45 H60 V60 H40 Z M46 60 C 46 78 40 88 30 96 H70 C 60 88 54 78 54 60 Z"/></symbol>
    <symbol id="s3" viewBox="0 0 100 100"><path d="M50 3 L 88 50 L 50 97 L 12 50 Z"/></symbol>
  </svg>

  <!-- ホーム -->
  <main class="home" id="home">
    <header class="home__head">
      <h1 class="home__name">LONE DECK</h1>
      <p class="home__catch" data-t="tagline"></p>
    </header>

    <button class="btn btn--main btn--wide" id="continueBtn" data-t="btn.continue" hidden></button>

    <div class="home__modes">
      <button class="home__card" id="homeDaily" type="button">
        <span class="home__card-name" data-t="mode.daily"></span>
        <span class="home__card-sub" id="homeDailySub"></span>
      </button>
      <button class="home__card" id="homeFree" type="button">
        <span class="home__card-name" data-t="mode.free"></span>
        <span class="home__card-sub" id="homeFreeSub"></span>
      </button>
    </div>

    <ol class="howto">
      <li data-t="howto.1"></li>
      <li data-t="howto.2"></li>
      <li data-t="howto.3"></li>
    </ol>

    <footer class="credit">
      <a href="https://t-of.github.io/" data-t="credit">T.OF... のアプリ</a>・<a href="https://t-of.github.io/contact/" data-t="contact" target="_blank" rel="noopener">問い合わせ</a>
      <button class="pill" data-wak="install" data-t="btn.install" hidden>アプリにする</button>
      <button class="pill" data-wak="share" data-t="btn.share">共有</button>
    </footer>
  </main>

  <main class="app" id="app" hidden>
    <header class="bar">
      <div class="modes">
        <button class="mode" id="modeDaily" type="button"><span data-t="mode.daily"></span><b id="dailyNo"></b></button>
        <button class="mode" id="modeFree" type="button"><span data-t="mode.free"></span><b id="freeNo"></b></button>
      </div>
      <div class="hud"><span id="hudMoves"></span><span id="hudTime"></span></div>
      <button class="iconbtn" id="menuBtn" type="button" data-t-label="btn.menu"><i></i><i></i><i></i></button>
    </header>

    <section class="board" id="board"></section>

    <nav class="dock">
      <button class="btn btn--main" id="undoBtn" type="button" data-t="btn.undo"></button>
      <button class="btn" id="hintBtn" type="button" data-t="btn.hint"></button>
      <button class="btn btn--gold" id="finishBtn" type="button" data-t="btn.autoFinish" hidden></button>
      <button class="btn" id="newBtn" type="button" data-t="btn.newDeal"></button>
    </nav>

    <footer class="credit">
      <a href="https://t-of.github.io/" data-t="credit">T.OF... のアプリ</a>・<a href="https://t-of.github.io/contact/" data-t="contact" target="_blank" rel="noopener">問い合わせ</a>
      <button class="pill" data-wak="install" data-t="btn.install" hidden>アプリにする</button>
      <button class="pill" data-wak="share" data-t="btn.share">共有</button>
    </footer>
  </main>

  <!-- 記録・メニュー・結果・知らせ（閉じると display: none） -->
  <dialog class="sheet" id="sheet"><div class="sheet__body" id="sheetBody"></div></dialog>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
